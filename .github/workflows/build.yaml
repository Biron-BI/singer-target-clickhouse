name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-push:
    runs-on: ubuntu-24.04
    env:
      ORG_GRADLE_PROJECT_mavenBironUsername: ${{ secrets.MAVEN_USERNAME }}
      ORG_GRADLE_PROJECT_mavenBironPassword: ${{ secrets.MAVEN_PASSWORD }}
      ORG_GRADLE_PROJECT_mavenBironUrl: ${{ vars.MAVEN_URL }}
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'oracle'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run build with Gradle wrapper
        working-directory: .
        run: ./gradlew build

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: build-reports
          path: build/reports/

      - name: Login to Google Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY_GOOGLE_REGISTRY }}
          username: _json_key
          password: ${{ secrets.DOCKER_REGISTRY_GOOGLE_JSON_KEY }}

      - name: Build and push Docker image for back
        uses: docker/build-push-action@v2
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ vars.DOCKER_REGISTRY_GOOGLE_REGISTRY }}/${{ vars.DOCKER_REGISTRY_GOOGLE_PROJECT }}/singer-target-clickhouse:${{ github.ref_name }}
          build-args: |
            MAVEN_USERNAME=${{ secrets.MAVEN_USERNAME }}
            MAVEN_PASSWORD=${{ secrets.MAVEN_PASSWORD }}
            MAVEN_URL=${{ vars.MAVEN_URL }}
