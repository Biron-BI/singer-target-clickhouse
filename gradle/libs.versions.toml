[versions]
kotlin = "2.0.20"
arrow = "1.2.4"
spring = "3.3.3"
#test
kotest = "5.9.1"
mockk = "1.13.11"
testcontainers = "1.20.4"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring" }
gitVersion = { id = "com.palantir.git-version", version = "3.1.0" }

[libraries]
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version = "7.0.0" }
arrow = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
clickhouse-jdbc = { module = "com.clickhouse:clickhouse-jdbc", version = "0.6.0" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version = "5.2.3" }
lz4-java = { module = "org.lz4:lz4-pure-java", version = "1.8.0" }
#test
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-framework-datatest = { module = "io.kotest:kotest-framework-datatest", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-arrow = { module = "io.kotest.extensions:kotest-assertions-arrow", version = "1.4.0" }
kotest-spring = { module = "io.kotest.extensions:kotest-extensions-spring", version = "1.3.0" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-clickhouse = { module = "org.testcontainers:clickhouse", version.ref = "testcontainers" }

[bundles]
kotest = ["kotest-runner", "kotest-framework-datatest", "kotest-property", "kotest-assertions-core"]
