[versions]
arrow = "1.2.4"
clickhouse-jdbc = "0.9.5"
clikt = "4.4.0"
jimfs = "1.3.0"
kotest = "5.9.1"
kotest-assertions-arrow = "1.4.0"
kotest-extensions-spring = "1.3.0"
kotlin = "2.2.21"
kotlin-logging = "7.0.0"
kover = "0.9.1"
mockk = "1.14.5"
palantir-git-version = "3.1.0"
spring-boot = "3.5.12"
testcontainers = "2.0.2"

[libraries]
arrow-core = { group = "io.arrow-kt", name = "arrow-core", version.ref = "arrow" }
arrow-fx-coroutines = { group = "io.arrow-kt", name = "arrow-fx-coroutines", version.ref = "arrow" }
clickhouse-jdbc = { group = "com.clickhouse", name = "clickhouse-jdbc", version.ref = "clickhouse-jdbc" }
clikt = { group = "com.github.ajalt.clikt", name = "clikt", version.ref = "clikt" }
jimfs = { group = "com.google.jimfs", name = "jimfs", version.ref = "jimfs" }
kotest-assertions-arrow = { group = "io.kotest.extensions", name = "kotest-assertions-arrow", version.ref = "kotest-assertions-arrow" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-assertions-json = { group = "io.kotest", name = "kotest-assertions-json", version.ref = "kotest" }
kotest-extensions-spring = { group = "io.kotest.extensions", name = "kotest-extensions-spring", version.ref = "kotest-extensions-spring" }
kotest-framework-datatest = { group = "io.kotest", name = "kotest-framework-datatest", version.ref = "kotest" }
kotest-property = { group = "io.kotest", name = "kotest-property", version.ref = "kotest" }
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging-jvm", version.ref = "kotlin-logging" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
testcontainers-clickhouse = { group = "org.testcontainers", name = "testcontainers-clickhouse", version.ref = "testcontainers" }
testcontainers-core = { group = "org.testcontainers", name = "testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
palantir-git-version = { id = "com.palantir.git-version", version.ref = "palantir-git-version" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
